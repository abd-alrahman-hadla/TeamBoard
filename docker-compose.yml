name: teamboard

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: teamboard
      POSTGRES_PASSWORD: teamboard
      POSTGRES_DB: teamboard
    ports:
      # 5433 on the host: a native Postgres already uses 5432 on the dev machine.
      - '5433:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamboard -d teamboard']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
