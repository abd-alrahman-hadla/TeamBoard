# Load balancer for the `scale` profile: round-robin over every `api` replica.
# Docker's DNS returns all replica addresses for `api`, and nginx resolves them at startup.
# No sticky sessions: clients use WebSocket-only Socket.io, so each connection stays on one replica,
# and the Redis adapter carries events and presence between replicas.

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api {
    server api:4000;
  }

  server {
    listen 80;

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
