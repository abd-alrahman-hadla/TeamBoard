# Single public origin for docker-compose.prod.yml:
#   /api/*       → API replicas (prefix stripped), so auth cookies are first-party
#   /socket.io/* → API replicas (WebSocket upgrade)
#   everything else → the Next.js server
# Balances over every `api` replica (Docker DNS returns them all at startup). No sticky
# sessions needed: Socket.io is WebSocket-only, and the Redis adapter links the replicas.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  server_tokens off;
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api {
    # Shared-memory zone: every worker sees the same balancing state (without it, each worker
    # starts its own round-robin at the first replica). least_conn suits long-lived WebSockets.
    zone api 64k;
    least_conn;
    server api:4000;
  }

  upstream web {
    server web:3000;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
      # The trailing slash strips /api: /api/auth/login → /auth/login.
      proxy_pass http://api/;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
    }
  }
}
